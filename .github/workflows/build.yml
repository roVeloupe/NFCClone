name: Build IPA

on:
  push:
    branches: [main, master]
    paths:
      - "Sources/**"
      - "Info.plist"
      - "NFCClone.entitlements"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      buildConfig:
        description: Build configuration
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
      skipLdid:
        description: Skip ldid injection (just build unsigned)
        required: false
        default: false
        type: boolean

env:
  SCHEME: NFCClone
  BUNDLE_ID: com.apple.nfcd
  CONFIGURATION: Release

jobs:
  build-ipa:
    name: Build NFCClone IPA
    runs-on: macos-15  # macOS Sequoia (Xcode 16) — 最新稳定

    steps:
      # ── Step 1: 检查环境 ──────────────────────────────────────
      - name: Check environment
        run: |
          echo "=== Environment ==="
          sw_vers
          xcodebuild -version
          echo "==================="
          ls -la

      # ── Step 2: Checkout ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 3: Install XcodeGen ──────────────────────────────
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      # ── Step 4: 生成 Xcode 项目（repo root = project root）────
      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la NFCClone.xcodeproj/
          echo "--- Sources ---"
          ls -la Sources/

      # ── Step 5: Archive（不签名）──────────────────────────────
      # CODE_SIGNING_ALLOWED=NO 让 xcodebuild 完全跳过签名
      - name: Archive (unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project NFCClone.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphoneos \
            -configuration "${{ env.CONFIGURATION }}" \
            -archivePath build/NFCClone.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build/archive.log

      # ── Step 6: 注入 entitlements + ldid ──────────────────────
      - name: Inject entitlements with ldid
        run: |
          curl -sL https://github.com/lyrebirdstudios/ldid/releases/download/v2.1.5/ldid_macos.zip -o /tmp/ldid.zip
          unzip -o /tmp/ldid.zip -d /tmp/ldid/
          chmod +x /tmp/ldid/ldid

          APP_PATH="build/NFCClone.xcarchive/Products/Applications/NFCClone.app"

          if [ -f "$APP_PATH/NFCClone" ]; then
            /tmp/ldid/ldid -SNFCClone.entitlements "$APP_PATH/NFCClone"
            echo "✅ Entitlements injected"
            /tmp/ldid/ldid -e "$APP_PATH/NFCClone"
          else
            echo "❌ App binary not found at $APP_PATH/NFCClone"
            ls -la "$APP_PATH/"
            exit 1
          fi

      # ── Step 7: ad-hoc 签名（让 IPA 能装上手机）────────────────
      - name: Ad-hoc code sign
        run: |
          APP_PATH="build/NFCClone.xcarchive/Products/Applications/NFCClone.app"

          codesign -f \
            -s - \
            --entitlements NFCClone.entitlements \
            --no-runtime \
            --deep \
            "$APP_PATH"

          echo "✅ Ad-hoc sign done"
          codesign --verify --deep --strict "$APP_PATH" || echo "Verification warnings (ok for ad-hoc)"

      # ── Step 8: 打包 IPA ──────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH="build/NFCClone.xcarchive/Products/Applications/NFCClone.app"
          IPA_NAME="NFCClone-${GITHUB_SHA::7}-$(date +%Y%m%d).ipa"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -r "$IPA_NAME" Payload > /dev/null
          cd ..

          echo "✅ IPA created: build/$IPA_NAME"
          ls -lh build/*.ipa

      # ── Step 9: 上传 Artifacts ────────────────────────────────
      - name: Upload IPA to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NFCClone-iOS
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/archive.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Release job: 打 tag 时自动发 Release ────────────────────
  release:
    name: Create Release on tag
    runs-on: ubuntu-latest
    needs: build-ipa
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: NFCClone-iOS
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "NFCClone ${{ github.ref_name }}"
          body: |
            ## 🎯 NFCClone ${{ github.ref_name }}

            **iOS NFC 卡复制 + 模拟 IPA — 企业证书签后可用**

            ### 设备要求
            - iPhone 12/12 Pro/12 Pro Max/12 mini (A14)
            - iOS 27 beta 1-4（beta 5 已补 FilzaSlop 漏洞）
            - 企业开发者证书（用于最终签名）

            ### 🔴 重要：IPA 需企业证书重签！
            本 Release 的 IPA 是 GitHub Actions 编译的 unsigned/ad-hoc 版本。
            安装前请用企业证书重签：
            ```
            codesign -f -s "Your Enterprise Cert" \
              --entitlements NFCClone.entitlements \
              NFCClone.app/NFCClone
            ```
          files: artifacts/*.ipa
          generate_release_notes: true
