name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SCHEME: NFCClone

jobs:
  build-ipa:
    name: Build NFCClone IPA
    runs-on: macos-15

    steps:
      - name: Check environment
        run: |
          sw_vers
          xcodebuild -version
          echo "=== GitHub Actions node ==="
          echo "${{ runner.os }} $(uname -m)"

      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls NFCClone.xcodeproj/
          ls Sources/

      - name: Prepare signing identity
        id: prepare-sign
        env:
          ENTERPRISE_P12_BASE64: ${{ secrets.ENTERPRISE_P12_BASE64 }}
          ENTERPRISE_P12_PASSWORD: ${{ secrets.ENTERPRISE_P12_PASSWORD }}
          ENTERPRISE_CERT_NAME: ${{ secrets.ENTERPRISE_CERT_NAME }}
          ENTERPRISE_MOBILEPROVISION_BASE64: ${{ secrets.ENTERPRISE_MOBILEPROVISION_BASE64 }}
        run: |
          set +e
          set -x
          mkdir -p build/signing

          # 检查有没有企业证书 Secrets
          if [ -n "$ENTERPRISE_P12_BASE64" ] && [ -n "$ENTERPRISE_P12_PASSWORD" ]; then
            echo "🔐 发现企业证书 Secrets，用企业证书签名"
            echo "enterprise_cert=true" >> "$GITHUB_OUTPUT"

            # base64 decode 出 .p12
            printf '%s' "$ENTERPRISE_P12_BASE64" | base64 --decode > build/signing/enterprise.p12
            ls -la build/signing/enterprise.p12

            # 创建临时钥匙串（macOS runner 必须）
            KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(head -c 16 /dev/urandom | xxd -p)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # 转换 p12 成 macOS security 兼容格式（新版 PBES2/PBKDF2 会让 security import 报 MAC verification failed）
            openssl pkcs12 -in build/signing/enterprise.p12 \
              -passin pass:"$ENTERPRISE_P12_PASSWORD" \
              -out build/signing/enterprise.legacy.p12 \
              -passout pass:"$ENTERPRISE_P12_PASSWORD" \
              -export -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES 2>&1 | tail -3
            mv build/signing/enterprise.legacy.p12 build/signing/enterprise.p12
            echo "p12 已转 legacy 格式"

            # 导入证书到钥匙串
            security import build/signing/enterprise.p12 \
              -P "$ENTERPRISE_P12_PASSWORD" \
              -A \
              -k "$KEYCHAIN_PATH" 2>&1
            echo "  import rc=$?"

            # 把钥匙串加入搜索列表
            security list-keychains -s "$KEYCHAIN_PATH"
            security set-key-partition-list \
              -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH"

            # 验证证书导入成功，取 Common Name
            if [ -n "$ENTERPRISE_CERT_NAME" ]; then
              CERT_NAME="$ENTERPRISE_CERT_NAME"
            else
              CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | \
                grep -oP '(?<=")[^"]*Enterprise[^"]*|iPhone Distribution: [^"]*|Developer ID[^"]*' | head -1 || \
                security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | \
                awk -F'"' '/codesigning/ {for(i=2;i<=NF;i+=2) print $i; exit}')
            fi
            echo "Using certificate: $CERT_NAME"
            echo "cert_name=$CERT_NAME" >> "$GITHUB_OUTPUT"

            # mobileprovision（可选）
            if [ -n "$ENTERPRISE_MOBILEPROVISION_BASE64" ]; then
              printf '%s' "$ENTERPRISE_MOBILEPROVISION_BASE64" | base64 --decode > build/signing/embedded.mobileprovision
              mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
              cp build/signing/embedded.mobileprovision \
                "$HOME/Library/MobileDevice/Provisioning Profiles/"
              echo "📦 mobileprovision 已安装"
            fi

          else
            echo "ℹ️ 没有企业证书 Secrets，用 ad-hoc 自签"
            echo "enterprise_cert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (unsigned, for device)
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild build \
            -project NFCClone.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            2>&1 | tee build/build.log; exit ${PIPESTATUS[0]}

      - name: Locate .app bundle
        run: |
          echo "=== Finding .app ==="
          find build/DerivedData -name "NFCClone.app" -type d 2>/dev/null
          APP_PATH=$(find build/DerivedData -name "NFCClone.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found! Dumping DerivedData..."
            find build/DerivedData -maxdepth 5 -type d 2>/dev/null | head -50
            exit 1
          fi

          echo "$APP_PATH" > build/app_path.txt
          ls -la "$APP_PATH/"

      # 条件签名：有企业证书 → 用企业证书，没配 → ad-hoc
      - name: Sign with enterprise cert
        if: steps.prepare-sign.outputs.enterprise_cert == 'true'
        run: |
          set +e
          set -x
          APP_PATH=$(cat build/app_path.txt)
          ENT_PUBLIC="Resources/NFCClone.entitlements.public"
          ENT_FULL="Resources/NFCClone.entitlements"

          # 不要用 secrets 里的 cert_name，GitHub masking 会替换成 ***
          CERT_NAME=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | grep -oP '"[^"]*"' | head -1 | tr -d '"')
          echo "=== 签名 identity: $CERT_NAME ==="
          cat "$ENT_PUBLIC"

          codesign -f \
            -s "$CERT_NAME" \
            --entitlements "$ENT_PUBLIC" \
            --deep \
            --options runtime \
            "$APP_PATH" 2>&1
          CS_RC=$?
          echo "  codesign rc=$CS_RC"
          if [ $CS_RC -ne 0 ]; then
            echo "❌ 企业证书签名失败"
            exit 1
          fi
          echo "✅ 企业证书签名成功"

          # 签完再把完整 entitlements 塞进 bundle
          cp "$ENT_FULL" "$APP_PATH/NFCClone.entitlements"

          codesign --verify --deep "$APP_PATH" || echo "⚠️ verify 有 warnings 可忽略"

      - name: Ad-hoc sign (fallback)
        if: steps.prepare-sign.outputs.enterprise_cert != 'true'
        run: |
          set +e
          set -x
          APP_PATH=$(cat build/app_path.txt)
          ENT_PUBLIC="Resources/NFCClone.entitlements.public"
          ENT_FULL="Resources/NFCClone.entitlements"

          echo "=== 用 ad-hoc 自签 ==="
          cat "$ENT_PUBLIC"

          codesign -f \
            -s - \
            --entitlements "$ENT_PUBLIC" \
            --deep \
            --options runtime \
            "$APP_PATH" 2>&1
          CS_RC=$?
          echo "  codesign rc=$CS_RC"
          if [ $CS_RC -ne 0 ]; then
            echo "❌ ad-hoc 签名失败"
            exit 1
          fi
          echo "✅ Ad-hoc 签名完成"

          # 签完再把完整 entitlements 塞进 bundle
          cp "$ENT_FULL" "$APP_PATH/NFCClone.entitlements"

      - name: Package IPA
        run: |
          APP_PATH=$(cat build/app_path.txt)
          IPA_NAME="NFCClone-${GITHUB_SHA::7}-$(date +%Y%m%d).ipa"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build && zip -r "$IPA_NAME" Payload > /dev/null && cd ..
          echo "✅ IPA: build/$IPA_NAME ($(du -h build/$IPA_NAME | cut -f1))"
          ls -lh build/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NFCClone-iOS
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 7

      # 清理临时钥匙串（runner 自动回收，但好习惯）
      - name: Cleanup
        if: always()
        run: |
          if [ -n "$RUNNER_TEMP" ] && [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          fi
          rm -rf build/signing
          echo "🧹 清理完成"
